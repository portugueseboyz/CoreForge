name: CoreForge CI

# Confere o app Linux (tauri/) a cada mudança: TypeScript, testes e clippy do Rust.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # semanal: pega avisos de segurança novos mesmo sem commits

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dependências do sistema (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - run: npm ci
      - name: Versions (package.json, Cargo.toml, tauri.conf.json)
        run: node scripts/check-versions.mjs
      - name: TypeScript e build do front-end
        run: npm run build
      - name: Testes do front-end
        run: npm test
      - name: Testes do Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

  # Auditorias de dependências: informativas (não derrubam o CI; avisos novos aparecem sem relação com o commit).
  audit-cargo:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - run: cargo install cargo-audit --locked
      - run: cargo audit --file src-tauri/Cargo.lock

  audit-npm:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high

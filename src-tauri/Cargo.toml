[package]
name = "coreforge"
version = "0.1.0"
description = "Hardware toolkit for Linux: system info, sensors, stress tests, benchmarks, fan and RGB control"
authors = ["CoreForge contributors"]
license = "MIT"
default-run = "coreforge"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "coreforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nvml-wrapper = "0.13.0"
ureq = "3.5.2"
wgpu = "30.0.2"
pollster = "1.0.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# O benchmark de CPU e os stress tests precisam de código otimizado também em debug.
[profile.dev]
opt-level = 3

[features]
# The helper is built on its own (see tauri.conf.json) and installed to /usr/libexec; keeping it out of the default
# bins stops the Tauri bundler from also copying it to /usr/bin.
helper = []

[[bin]]
name = "coreforge-helper"
path = "src/bin/coreforge-helper.rs"
required-features = ["helper"]

[[bin]]
name = "coreforge"
path = "src/main.rs"
